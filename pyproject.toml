[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saturn-frontier-browser-control"
version = "0.1.0"
description = "Constrained browser worker for Saturn frontier-directed tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60",
    "pydantic>=2",
    "python-dotenv",
    "typer",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
saturn-fbc = "saturn_fbc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/saturn_fbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires Playwright Chromium launch",
    "network: requires outbound network access",
]
