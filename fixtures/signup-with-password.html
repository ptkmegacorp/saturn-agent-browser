<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local signup with password — fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; }
    .hint { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Create account (broker fixture)</h1>
  <p class="hint">Password fields are filled by the Saturn broker, not the visual specialist.</p>

  <form id="signup-form" action="account-created.html" method="get">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••">

    <label for="password_confirm">Confirm password</label>
    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="••••••••">

    <button type="submit" id="submit-btn">Submit</button>
  </form>
</body>
</html>
